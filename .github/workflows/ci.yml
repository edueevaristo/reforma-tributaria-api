name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  testes:
    name: testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, dom, json, curl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Testes
        run: vendor/bin/phpunit

  padrao-de-codigo:
    name: padrao de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, json
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PSR-12 e compatibilidade PHP 7.4+
        run: vendor/bin/phpcs

  integracao:
    name: integracao (WireMock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, json, curl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Subir WireMock
        run: |
          docker compose -f wiremock/docker-compose.yml up -d
          for tentativa in $(seq 1 30); do
            curl -sf http://localhost:8089/__admin/health && exit 0
            sleep 2
          done
          docker compose -f wiremock/docker-compose.yml logs
          exit 1

      - name: Testes de integracao
        env:
          WIREMOCK_URL: http://localhost:8089
        run: vendor/bin/phpunit --testsuite integracao

      - name: Colecao do Postman atualizada
        run: |
          php bin/gerar-postman.php
          git diff --exit-code postman/

      - name: Colecao do Postman (Newman)
        run: |
          npx --yes newman@6 run postman/reforma-tributaria-wiremock.postman_collection.json \
            -e postman/wiremock-local.postman_environment.json \
            --timeout-request 30000

      - name: Logs do WireMock
        if: failure()
        run: docker compose -f wiremock/docker-compose.yml logs
